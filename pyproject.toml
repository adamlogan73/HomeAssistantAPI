[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0"]

[tool.poetry]
authors = ["GrandMoff100 <minecraftcrusher100@gmail.com>"]
description = "Python Wrapper for Homeassistant's REST API"
documentation = "https://homeassistantapi.readthedocs.io"
homepage = "https://github.com/GrandMoff100/HomeAssistantAPI"
license = "GPL-3.0-or-later"
name = "HomeAssistant-API"
readme = "README.md"
include = ["homeassistant_api/py.typed"]
repository = "https://github.com/GrandMoff100/HomeAssistantAPI"
version = "5.0.1"
packages = [{ include = "homeassistant_api" }]

[tool.poetry.dependencies]
aiohttp = "^3"
aiohttp-client-cache = "^0"
pydantic = "^2"
python = "^3.10,<4.0.0"
requests = "^2"
requests-cache = "^1"
simplejson = "^3"
websockets = "^15"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx-autodoc-typehints = "^1.25.2"
sphinx-rtd-theme = "^2.0.0"
autodoc-pydantic = "^2.0.1"

[tool.poetry.group.styling]
optional = true

[tool.poetry.group.styling.dependencies]
pre-commit = "^2.17.0"
types-docutils = "^0.17.5"
types-requests = "^2"
types-simplejson = "^3"
types-toml = "^0.10.4"
mypy = "^1.18"
ruff = "^0.13"

[tool.poetry.group.testing]
optional = true

[tool.poetry.group.testing.dependencies]
pytest-asyncio = "1.0.0"
pytest-cov = "^3.0.0"
pytest = "^8"
aiosqlite = "^0.20"

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli = true
# log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "def __repr__\\(self\\) -> str:",
    "raise RequestTimeoutError\\(",
    "except \\(json\\.decoder\\.JSONDecodeError, simplejson.decoder\\.JSONDecodeError\\) as err:",
    "pass",
    "last_updated < \\(now := datetime\\.now\\(\\)\\) - wait",
    "pragma: no cover"
]

[tool.ruff]
target-version = "py310"
output-format= "grouped"

[tool.ruff.lint]
exclude = [
    '.git',
    '__pycache__',
    '.github',
]
ignore = ['E501', 'D', 'FIX002', "TD", "G004"]
select = [
    'ALL',
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ['F401']
"conf.py" = ['E402']
"tests/**/*.py" = ["S101", "INP001", "PT011"]
"examples/**/*.py" = ["INP001"]
"docs/**/*.py" = ["INP001"]

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.mypy]
disable_error_code = [
    "no-untyped-def",
    "name-defined",
]
